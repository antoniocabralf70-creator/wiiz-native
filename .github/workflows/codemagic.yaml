# Codemagic -> salvar na raiz do repositório como codemagic.yaml
workflows:
  n64emu-apk:
    name: N64Emu APK
    instance_type: linux_x2
    max_build_duration: 60
    scripts:
      - name: Submódulos
        script: git submodule update --init --recursive
      - name: NDK e CMake
        script: yes | sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" || true
      - name: Build APK debug
        script: gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
