name: Build WiiXNative APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build WiiXNative APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Find and extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'WiiXNative-Android-GitHub.zip' -print -quit)"
          if [ -n "$ZIP_FILE" ]; then
            unzip -q -o "$ZIP_FILE" -d source
          fi

          SETTINGS_FILE="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo '::error::Não encontrei settings.gradle ou settings.gradle.kts.'
            find . -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Não encontrei app/build.gradle(.kts) em $PROJECT_DIR."
            exit 1
          fi
          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::Não encontrei AndroidManifest.xml em $PROJECT_DIR."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto Android localizado em: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace -p "${{ steps.project.outputs.dir }}" :app:assembleDebug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WiiXNative-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WiiXNative-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
