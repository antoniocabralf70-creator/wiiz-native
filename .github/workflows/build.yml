          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import java.util.UUID

          class MainActivity : AppCompatActivity() {
              lateinit var settings: Settings
              lateinit var library: Library
              private lateinit var holder: FrameLayout
              private lateinit var games: GamesTab
              private lateinit var mods: ModsTab
              private lateinit var config: SettingsTab
              private lateinit var navItems: List<TextView>
              var coverTarget: String? = null

              val addRoms = registerForActivityResult(ActivityResultContracts.OpenMultipleDocuments()) { uris ->
                  onRomsPicked(uris)
