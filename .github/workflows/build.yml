          package dev.n64emu.app

          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.SurfaceHolder
          import android.view.SurfaceView
          import android.view.View
          import android.widget.FrameLayout
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import java.io.File
          import java.io.FileOutputStream

          class EmulatorActivity : AppCompatActivity(), SurfaceHolder.Callback {
              private var started = false
              private var errorShown = false
              private var ticks = 0
              private val handler = Handler(Looper.getMainLooper())

              private val poll = object : Runnable {
                  override fun run() {
                      val st = NativeBridge.getStatus()
                      if (st.startsWith("ERRO")) {
                          showError(st)
                          return
                      }
                      ticks++
                      if (ticks < 60) handler.postDelayed(this, 500)
                  }
              }

              private fun showError(msg: String) {
                  if (errorShown || isFinishing) return
                  errorShown = true
                  AlertDialog.Builder(this)
                      .setTitle("Não consegui abrir o jogo")
                      .setMessage(msg + "\n\nAbra Config > Diagnóstico para ver o log e copiar.")
                      .setCancelable(false)
                      .setPositiveButton("Fechar") { _, _ -> finish() }
                      .show()
              }

              private fun setRunning(v: Boolean) {
                  getSharedPreferences("n64emu", MODE_PRIVATE).edit().putBoolean("game_running", v).apply()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val s = Settings(this)
                  val root = FrameLayout(this)
                  val sv = SurfaceView(this)
                  sv.holder.addCallback(this)
                  root.addView(sv)
                  val controls = ControlsView(this)
                  controls.alpha = s.controlsAlpha / 100f
                  controls.visibility = if (s.showControls) View.VISIBLE else View.GONE
                  root.addView(controls)
                  setContentView(root)

                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  val ctl = WindowInsetsControllerCompat(window, root)
                  ctl.hide(WindowInsetsCompat.Type.systemBars())
                  ctl.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
              }

              override fun surfaceCreated(h: SurfaceHolder) {
                  if (started) return
                  started = true
                  val uri = intent.data
                  if (uri == null) {
                      showError("ERRO: nenhuma ROM foi informada.")
                      return
                  }
                  val surface = h.surface
                  Thread {
                      try {
                          val s = Settings(this)
                          val rom = File(cacheDir, "rom.z64")
                          val ins = contentResolver.openInputStream(uri)
                          if (ins == null) {
                              runOnUiThread { showError("ERRO: não consegui abrir o arquivo da ROM (permissão perdida?). Remova e adicione a ROM de novo.") }
                              return@Thread
                          }
                          ins.use { i -> FileOutputStream(rom).use { o -> i.copyTo(o) } }

                          val sys = Storage.systemDir(this)
                          Storage.hiresDir(this)
                          File(sys, "hires_texture").mkdirs()
                          val saves = Storage.savesDir(this)

                          NativeBridge.init(
                              applicationInfo.nativeLibraryDir + "/libmupen_core.so",
                              sys.absolutePath,
                              saves.absolutePath,
                              Storage.logFile(this).absolutePath
                          )
                          NativeBridge.setOption("mupen64plus-cpucore", "dynamic_recompiler")
                          NativeBridge.setOption("mupen64plus-rdp-plugin", "gliden64")
                          NativeBridge.setOption("mupen64plus-rsp-plugin", "hle")
                          NativeBridge.setOption("mupen64plus-aspect", s.aspect)
                          NativeBridge.setOption("mupen64plus-EnableNativeResFactor", s.resolutionFactor.toString())
                          NativeBridge.setOption("mupen64plus-txHiresEnable", if (s.texturePacks) "True" else "False")
                          setRunning(true)
                          NativeBridge.start(rom.absolutePath, surface)
                          handler.post(poll)
                      } catch (e: Throwable) {
                          runOnUiThread { showError("ERRO: " + e.javaClass.simpleName + " - " + (e.message ?: "")) }
                      }
                  }.start()
              }

              override fun surfaceChanged(h: SurfaceHolder, f: Int, w: Int, hh: Int) {}

              override fun surfaceDestroyed(h: SurfaceHolder) {
                  handler.removeCallbacks(poll)
                  try {
                      NativeBridge.stop()
                  } catch (e: Throwable) {
                  }
                  setRunning(false)
                  started = false
              }

              override fun onPause() {
                  super.onPause()
                  try { NativeBridge.pause() } catch (e: Throwable) {}
              }

              override fun onResume() {
                  super.onResume()
                  try { NativeBridge.resume() } catch (e: Throwable) {}
              }
          }
