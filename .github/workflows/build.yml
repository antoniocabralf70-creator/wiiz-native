          package dev.n64emu.app

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.hypot

          /**
           * Controles na tela. IDs 0..15 = botões RetroPad; 100..103 = botões C.
           * O analógico é flutuante: nasce onde o dedo toca (zona esquerda-baixo), segue o dedo
           * e só aquele dedo o controla. Isso evita os "pulos" do analógico.
           */
          class ControlsView(ctx: Context) : View(ctx) {
              private class Btn(val id: Int, val label: String, val cx: Float, val cy: Float, val r: Float)

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private var btns = listOf<Btn>()
              private val pressed = BooleanArray(16)
              private var cX = 0f
              private var cY = 0f

              private var zoneRight = 0f
              private var zoneTop = 0f
              private var homeX = 0f
              private var homeY = 0f
              private var stickR = 0f
              private var stickPid = -1
              private var ox = 0f
              private var oy = 0f
              private var kx = 0f
              private var ky = 0f
              private var outX = 0f
              private var outY = 0f

              private val dead = 0.12f

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  val u = h.toFloat()
                  val W = w.toFloat()
                  stickR = 0.17f * u
                  zoneRight = 0.45f * W
                  zoneTop = 0.50f * u
                  homeX = 0.17f * W
                  homeY = 0.76f * u
                  val d = 0.095f * u
                  val dr = 0.05f * u
                  val dx = 0.11f * W
                  val dy = 0.31f * u
                  val ccx = 0.80f * W
                  val ccy = 0.30f * u
                  val cr = 0.05f * u
                  val co = 0.10f * u
                  btns = listOf(
                      Btn(4, "▲", dx, dy - d, dr), Btn(5, "▼", dx, dy + d, dr),
                      Btn(6, "◀", dx - d, dy, dr), Btn(7, "▶", dx + d, dy, dr),
                      Btn(0, "A", 0.91f * W, 0.68f * u, 0.085f * u),
                      Btn(1, "B", 0.80f * W, 0.78f * u, 0.075f * u),
                      Btn(3, "ST", 0.50f * W, 0.92f * u, 0.055f * u),
                      Btn(10, "L", 0.07f * W, 0.09f * u, 0.065f * u),
                      Btn(12, "Z", 0.16f * W, 0.09f * u, 0.065f * u),
                      Btn(11, "R", 0.93f * W, 0.09f * u, 0.065f * u),
                      Btn(100, "C▲", ccx, ccy - co, cr), Btn(101, "C▼", ccx, ccy + co, cr),
                      Btn(102, "C◀", ccx - co, ccy, cr), Btn(103, "C▶", ccx + co, ccy, cr),
                  )
              }

              override fun onDraw(c: Canvas) {
                  val active = stickPid != -1
                  val bx = if (active) ox else homeX
                  val by = if (active) oy else homeY
                  paint.style = Paint.Style.FILL
                  paint.color = Color.argb(if (active) 80 else 45, 255, 255, 255)
                  c.drawCircle(bx, by, stickR, paint)
                  paint.color = Color.argb(if (active) 170 else 90, 255, 255, 255)
                  c.drawCircle(bx + kx * stickR, by + ky * stickR, stickR * 0.4f, paint)
                  for (b in btns) {
                      val on = if (b.id < 16) pressed[b.id] else isCOn(b.id)
                      paint.color = Color.argb(if (on) 170 else 80, 255, 255, 255)
                      c.drawCircle(b.cx, b.cy, b.r, paint)
                      paint.color = Color.argb(220, 0, 0, 0)
                      paint.textSize = b.r * 0.8f
                      paint.textAlign = Paint.Align.CENTER
                      c.drawText(b.label, b.cx, b.cy + b.r * 0.28f, paint)
                  }
              }

              private fun isCOn(id: Int) = when (id) {
                  100 -> cY < -0.5f
                  101 -> cY > 0.5f
                  102 -> cX < -0.5f
                  else -> cX > 0.5f
              }

              private fun overButton(x: Float, y: Float): Boolean {
                  for (b in btns) if (hypot(x - b.cx, y - b.cy) < b.r * 1.25f) return true
                  return false
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  val act = e.actionMasked
                  val ai = e.actionIndex
                  when (act) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                          val x = e.getX(ai)
                          val y = e.getY(ai)
                          if (stickPid == -1 && x < zoneRight && y > zoneTop && !overButton(x, y)) {
                              stickPid = e.getPointerId(ai)
                              ox = x
                              oy = y
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP -> {
                          if (e.getPointerId(ai) == stickPid) stickPid = -1
                      }
                      MotionEvent.ACTION_CANCEL -> stickPid = -1
                  }
                  val lifting = act == MotionEvent.ACTION_UP || act == MotionEvent.ACTION_POINTER_UP
                  val cancel = act == MotionEvent.ACTION_CANCEL

                  // analógico
                  var sx = 0f
                  var sy = 0f
                  kx = 0f
                  ky = 0f
                  if (stickPid != -1) {
                      val idx = e.findPointerIndex(stickPid)
                      if (idx >= 0) {
                          val px = e.getX(idx)
                          val py = e.getY(idx)
                          var dx = px - ox
                          var dy = py - oy
                          val d = hypot(dx, dy)
                          if (d > stickR) {
                              val k = (d - stickR) / d
                              ox += dx * k
                              oy += dy * k
                              dx = px - ox
                              dy = py - oy
                          }
                          var nx = dx / stickR
                          var ny = dy / stickR
                          kx = nx
                          ky = ny
                          val mag = hypot(nx, ny)
                          if (mag < dead) {
                              nx = 0f
                              ny = 0f
                          } else {
                              val s = ((mag - dead) / (1f - dead)).coerceAtMost(1f) / mag
                              nx *= s
                              ny *= s
                          }
                          sx = nx
                          sy = ny
                      } else {
                          stickPid = -1
                      }
                  }

                  // botões
                  val np = BooleanArray(16)
                  var ncx = 0f
                  var ncy = 0f
                  if (!cancel) {
                      for (i in 0 until e.pointerCount) {
                          if (lifting && i == ai) continue
                          if (e.getPointerId(i) == stickPid) continue
                          val x = e.getX(i)
                          val y = e.getY(i)
                          for (b in btns) {
                              if (hypot(x - b.cx, y - b.cy) < b.r * 1.25f) {
                                  when (b.id) {
                                      100 -> ncy = -1f
                                      101 -> ncy = 1f
                                      102 -> ncx = -1f
                                      103 -> ncx = 1f
                                      else -> np[b.id] = true
                                  }
                              }
                          }
                      }
                  }
                  for (i in 0..15) {
                      if (np[i] != pressed[i]) {
                          pressed[i] = np[i]
                          NativeBridge.setButton(i, np[i])
                      }
                  }
                  if (sx != outX || sy != outY) {
                      outX = sx
                      outY = sy
                      NativeBridge.setAnalog(0, sx, sy)
                  }
                  if (ncx != cX || ncy != cY) {
                      cX = ncx
                      cY = ncy
                      NativeBridge.setAnalog(1, cX, cY)
                  }
                  invalidate()
                  return true
              }
          }
