name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar Android SDK (ja vem na maquina)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Gerar projeto 64exem
        run: |
          set -e
          mkdir -p app
          mkdir -p app/src/main
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/java/dev/n64emu/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values
          cat > app/build.gradle.kts <<'N64EMU_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "dev.n64emu.app"
              compileSdk = 34
              ndkVersion = "26.1.10909125"
              defaultConfig {
                  applicationId = "dev.n64emu.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.2.0"
                  ndk { abiFilters += listOf("arm64-v8a") }
                  externalNativeBuild { cmake { cppFlags += "-std=c++17" } }
              }
              externalNativeBuild { cmake { path = file("src/main/cpp/CMakeLists.txt"); version = "3.22.1" } }
              packaging { jniLibs { useLegacyPackaging = true } }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          N64EMU_EOF
          cat > app/src/main/AndroidManifest.xml <<'N64EMU_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:glEsVersion="0x00030000" android:required="true" />
              <application
                  android:label="64exem"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".EmulatorActivity"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden" />
              </application>
          </manifest>
          N64EMU_EOF
          cat > app/src/main/cpp/CMakeLists.txt <<'N64EMU_EOF'
          cmake_minimum_required(VERSION 3.22)
          project(n64emu)

          # libretro.h é baixado pelo CI para app/src/main/cpp/include
          add_library(n64emu SHARED native-lib.cpp)
          target_include_directories(n64emu PRIVATE ${CMAKE_CURRENT_SOURCE_DIR}/include)
          target_link_libraries(n64emu android log EGL GLESv3 aaudio dl)
          N64EMU_EOF
          cat > app/src/main/cpp/native-lib.cpp <<'N64EMU_EOF'
          // Host libretro: carrega o núcleo mupen64plus_next (GLideN64) e roda a ROM.
          #include <jni.h>
          #include <android/log.h>
          #include <android/native_window_jni.h>
          #include <aaudio/AAudio.h>
          #include <EGL/egl.h>
          #include <GLES3/gl3.h>
          #include <dlfcn.h>
          #include <unistd.h>
          #include <atomic>
          #include <condition_variable>
          #include <cstdarg>
          #include <cstdio>
          #include <cstring>
          #include <map>
          #include <mutex>
          #include <set>
          #include <string>
          #include <thread>
          #include <vector>
          #include "libretro.h"

          #define TAG "N64Emu"

          namespace {

          FILE* g_logf = nullptr;
          std::mutex g_logMutex;
          std::string g_status;
          std::mutex g_statusMutex;

          void logm(int prio, const char* tag, const char* fmt, ...) {
              char buf[1024];
              va_list ap;
              va_start(ap, fmt);
              vsnprintf(buf, sizeof(buf), fmt, ap);
              va_end(ap);
              __android_log_write(prio, tag, buf);
              std::lock_guard<std::mutex> l(g_logMutex);
              if (g_logf) { fprintf(g_logf, "[%s] %s\n", tag, buf); fflush(g_logf); }
          }
          #define LOGI(...) logm(ANDROID_LOG_INFO, TAG, __VA_ARGS__)
          #define LOGE(...) logm(ANDROID_LOG_ERROR, TAG, __VA_ARGS__)

          void setStatus(const std::string& s) {
              std::lock_guard<std::mutex> l(g_statusMutex);
              g_status = s;
              if (s.rfind("ERRO", 0) == 0) LOGE("%s", s.c_str());
          }

          void* g_lib = nullptr;
          void (*p_set_environment)(retro_environment_t);
          void (*p_set_video_refresh)(retro_video_refresh_t);
          void (*p_set_audio_sample)(retro_audio_sample_t);
          void (*p_set_audio_batch)(retro_audio_sample_batch_t);
          void (*p_set_input_poll)(retro_input_poll_t);
          void (*p_set_input_state)(retro_input_state_t);
          void (*p_init)(void);
          void (*p_deinit)(void);
          void (*p_get_system_info)(struct retro_system_info*);
          void (*p_get_av_info)(struct retro_system_av_info*);
          bool (*p_load_game)(const struct retro_game_info*);
          void (*p_unload_game)(void);
          void (*p_run)(void);

          std::string g_libPath, g_systemDir, g_saveDir;
          std::map<std::string, std::string> g_options;
          std::mutex g_optMutex;
          std::atomic<bool> g_optionsDirty{true};

          std::atomic<bool> g_running{false};
          std::atomic<bool> g_paused{false};
          std::thread g_thread;
          std::mutex g_pauseMutex;
          std::condition_variable g_pauseCv;
          ANativeWindow* g_window = nullptr;

          EGLDisplay g_dpy = EGL_NO_DISPLAY;
          EGLSurface g_surf = EGL_NO_SURFACE;
          EGLContext g_ctx = EGL_NO_CONTEXT;
          retro_hw_render_callback g_hw{};
          GLuint g_fbo = 0, g_tex = 0, g_rbo = 0;
          unsigned g_fboW = 0, g_fboH = 0;
          unsigned g_frameW = 0, g_frameH = 0;
          float g_aspect = 4.0f / 3.0f;
          int g_sampleRate = 44100;
          bool g_firstFrame = true;

          AAudioStream* g_audio = nullptr;
          std::atomic<int> g_buttons{0};
          std::atomic<int> g_axes[4] = {};

          #define LOAD(var, name)                                   \
              var = (decltype(var))dlsym(g_lib, name);              \
              if (!var) { LOGE("simbolo ausente: %s", name); return false; }

          bool loadCore() {
              g_lib = dlopen(g_libPath.c_str(), RTLD_NOW | RTLD_LOCAL);
              if (!g_lib) { LOGE("dlopen falhou: %s", dlerror()); return false; }
              LOAD(p_set_environment, "retro_set_environment");
              LOAD(p_set_video_refresh, "retro_set_video_refresh");
              LOAD(p_set_audio_sample, "retro_set_audio_sample");
              LOAD(p_set_audio_batch, "retro_set_audio_sample_batch");
              LOAD(p_set_input_poll, "retro_set_input_poll");
              LOAD(p_set_input_state, "retro_set_input_state");
              LOAD(p_init, "retro_init");
              LOAD(p_deinit, "retro_deinit");
              LOAD(p_get_system_info, "retro_get_system_info");
              LOAD(p_get_av_info, "retro_get_system_av_info");
              LOAD(p_load_game, "retro_load_game");
              LOAD(p_unload_game, "retro_unload_game");
              LOAD(p_run, "retro_run");
              return true;
          }

          // ---------- FBO ----------
          void createFbo(unsigned w, unsigned h) {
              glGenFramebuffers(1, &g_fbo);
              glGenTextures(1, &g_tex);
              glGenRenderbuffers(1, &g_rbo);
              glBindTexture(GL_TEXTURE_2D, g_tex);
              glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA8, w, h, 0, GL_RGBA, GL_UNSIGNED_BYTE, nullptr);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_LINEAR);
              glBindRenderbuffer(GL_RENDERBUFFER, g_rbo);
              glRenderbufferStorage(GL_RENDERBUFFER, GL_DEPTH24_STENCIL8, w, h);
              glBindFramebuffer(GL_FRAMEBUFFER, g_fbo);
              glFramebufferTexture2D(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_TEXTURE_2D, g_tex, 0);
              glFramebufferRenderbuffer(GL_FRAMEBUFFER, GL_DEPTH_STENCIL_ATTACHMENT, GL_RENDERBUFFER, g_rbo);
              g_fboW = w; g_fboH = h;
              LOGI("FBO %ux%u status=0x%x", w, h, glCheckFramebufferStatus(GL_FRAMEBUFFER));
          }
          void resizeFbo(unsigned w, unsigned h) {
              if (!g_fbo) return;
              if (w <= g_fboW && h <= g_fboH) return;
              if (w < g_fboW) w = g_fboW;
              if (h < g_fboH) h = g_fboH;
              glBindTexture(GL_TEXTURE_2D, g_tex);
              glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA8, w, h, 0, GL_RGBA, GL_UNSIGNED_BYTE, nullptr);
              glBindRenderbuffer(GL_RENDERBUFFER, g_rbo);
              glRenderbufferStorage(GL_RENDERBUFFER, GL_DEPTH24_STENCIL8, w, h);
              g_fboW = w; g_fboH = h;
              LOGI("FBO redimensionado %ux%u", w, h);
          }
          void destroyFbo() {
              if (g_fbo) glDeleteFramebuffers(1, &g_fbo);
              if (g_tex) glDeleteTextures(1, &g_tex);
              if (g_rbo) glDeleteRenderbuffers(1, &g_rbo);
              g_fbo = g_tex = g_rbo = 0;
              g_fboW = g_fboH = 0;
          }

          // ---------- callbacks ----------
          void logCb(enum retro_log_level level, const char* fmt, ...) {
              char buf[1024];
              va_list ap;
              va_start(ap, fmt);
              vsnprintf(buf, sizeof(buf), fmt, ap);
              va_end(ap);
              size_t n = strlen(buf);
              while (n > 0 && (buf[n - 1] == '\n' || buf[n - 1] == '\r')) buf[--n] = 0;
              int prio = level == RETRO_LOG_ERROR ? ANDROID_LOG_ERROR
                       : level == RETRO_LOG_WARN  ? ANDROID_LOG_WARN
                       : level == RETRO_LOG_INFO  ? ANDROID_LOG_INFO : ANDROID_LOG_DEBUG;
              logm(prio, "N64Core", "%s", buf);
          }

          uintptr_t getCurrentFb() { return (uintptr_t)g_fbo; }
          retro_proc_address_t getProc(const char* sym) {
              void* p = (void*)eglGetProcAddress(sym);
              if (!p) p = dlsym(RTLD_DEFAULT, sym);
              return (retro_proc_address_t)p;
          }

          void updateAspect(const retro_game_geometry& g) {
              if (g.aspect_ratio > 0) g_aspect = g.aspect_ratio;
              else if (g.base_height) g_aspect = (float)g.base_width / (float)g.base_height;
          }

          bool envCb(unsigned cmd, void* data) {
              static std::set<unsigned> seen;
              switch (cmd) {
                  case RETRO_ENVIRONMENT_GET_CAN_DUPE: *(bool*)data = true; return true;
                  case RETRO_ENVIRONMENT_SET_PIXEL_FORMAT: return true;
                  case RETRO_ENVIRONMENT_GET_SYSTEM_DIRECTORY: *(const char**)data = g_systemDir.c_str(); return true;
                  case RETRO_ENVIRONMENT_GET_SAVE_DIRECTORY: *(const char**)data = g_saveDir.c_str(); return true;
                  case RETRO_ENVIRONMENT_GET_LOG_INTERFACE: ((retro_log_callback*)data)->log = logCb; return true;
                  case RETRO_ENVIRONMENT_GET_VARIABLE: {
                      auto* v = (retro_variable*)data;
                      std::lock_guard<std::mutex> l(g_optMutex);
                      auto it = g_options.find(v->key);
                      if (it == g_options.end()) return false;
                      v->value = it->second.c_str();
                      static bool cpuLogged = false;
                      if (!cpuLogged && strcmp(v->key, "mupen64plus-cpucore") == 0) { cpuLogged = true; LOGI("cpucore=%s", v->value); }
                      return true;
                  }
                  case RETRO_ENVIRONMENT_GET_VARIABLE_UPDATE:
                      *(bool*)data = g_optionsDirty.exchange(false);
                      return true;
                  case RETRO_ENVIRONMENT_SET_VARIABLES: {
                      // Registra o valor padrao (1o da lista) de cada opcao, como o RetroArch faz.
                      // Sem isso o nucleo cai em Pure Interpreter (lentissimo). O que o usuario ja definiu nao e sobrescrito.
                      for (auto* v = (const retro_variable*)data; v && v->key; v++) {
                          if (!v->value) continue;
                          const char* semi = strstr(v->value, "; ");
                          if (!semi) continue;
                          std::string rest(semi + 2);
                          std::string first = rest.substr(0, rest.find('|'));
                          std::lock_guard<std::mutex> l(g_optMutex);
                          g_options.emplace(v->key, first);
                      }
                      return true;
                  }
                  case RETRO_ENVIRONMENT_SET_PERFORMANCE_LEVEL: return true;
                  case RETRO_ENVIRONMENT_SET_INPUT_DESCRIPTORS: return true;
                  case RETRO_ENVIRONMENT_SET_CONTROLLER_INFO: return true;
                  case RETRO_ENVIRONMENT_SET_SERIALIZATION_QUIRKS: return true;
                  case RETRO_ENVIRONMENT_SET_GEOMETRY:
                      updateAspect(*(retro_game_geometry*)data);
                      return true;
                  case RETRO_ENVIRONMENT_SET_SYSTEM_AV_INFO: {
                      auto* av = (retro_system_av_info*)data;
                      updateAspect(av->geometry);
                      if (av->timing.sample_rate > 0) g_sampleRate = (int)av->timing.sample_rate;
                      resizeFbo(av->geometry.max_width, av->geometry.max_height);
                      return true;
                  }
                  case RETRO_ENVIRONMENT_SET_HW_RENDER: {
                      auto* hw = (retro_hw_render_callback*)data;
                      hw->get_current_framebuffer = getCurrentFb;
                      hw->get_proc_address = getProc;
                      g_hw = *hw;
                      LOGI("HW render pedido: tipo=%u v%u.%u", (unsigned)hw->context_type, hw->version_major, hw->version_minor);
                      return true;
                  }
                  default:
                      if (seen.insert(cmd).second) LOGI("env cmd %u nao tratado", cmd);
                      return false;
              }
          }

          void present() {
              EGLint sw = 0, sh = 0;
              eglQuerySurface(g_dpy, g_surf, EGL_WIDTH, &sw);
              eglQuerySurface(g_dpy, g_surf, EGL_HEIGHT, &sh);
              GLboolean scissor = glIsEnabled(GL_SCISSOR_TEST);
              glDisable(GL_SCISSOR_TEST);
              glBindFramebuffer(GL_DRAW_FRAMEBUFFER, 0);
              glViewport(0, 0, sw, sh);
              glClearColor(0, 0, 0, 1);
              glClear(GL_COLOR_BUFFER_BIT);
              int dw = sw, dh = (int)(sw / g_aspect);
              if (dh > sh) { dh = sh; dw = (int)(sh * g_aspect); }
              int dx = (sw - dw) / 2, dy = (sh - dh) / 2;
              unsigned fw = g_frameW < g_fboW ? g_frameW : g_fboW;
              unsigned fh = g_frameH < g_fboH ? g_frameH : g_fboH;
              glBindFramebuffer(GL_READ_FRAMEBUFFER, g_fbo);
              glBlitFramebuffer(0, 0, fw, fh, dx, dy, dx + dw, dy + dh, GL_COLOR_BUFFER_BIT, GL_LINEAR);
              glBindFramebuffer(GL_FRAMEBUFFER, g_fbo);
              if (scissor) glEnable(GL_SCISSOR_TEST);
              eglSwapBuffers(g_dpy, g_surf);
          }

          void videoCb(const void* data, unsigned w, unsigned h, size_t) {
              if (!data || !g_fbo) return;
              if (g_firstFrame) { g_firstFrame = false; LOGI("primeiro frame %ux%u", w, h); }
              g_frameW = w; g_frameH = h;
              present();
          }

          void audioOpen(int rate) {
              AAudioStreamBuilder* b = nullptr;
              if (AAudio_createStreamBuilder(&b) != AAUDIO_OK) return;
              AAudioStreamBuilder_setDirection(b, AAUDIO_DIRECTION_OUTPUT);
              AAudioStreamBuilder_setFormat(b, AAUDIO_FORMAT_PCM_I16);
              AAudioStreamBuilder_setChannelCount(b, 2);
              AAudioStreamBuilder_setSampleRate(b, rate);
              AAudioStreamBuilder_setPerformanceMode(b, AAUDIO_PERFORMANCE_MODE_LOW_LATENCY);
              if (AAudioStreamBuilder_openStream(b, &g_audio) == AAUDIO_OK) AAudioStream_requestStart(g_audio);
              else { g_audio = nullptr; LOGE("AAudio nao abriu"); }
              AAudioStreamBuilder_delete(b);
          }
          void audioClose() {
              if (g_audio) { AAudioStream_requestStop(g_audio); AAudioStream_close(g_audio); g_audio = nullptr; }
          }
          size_t audioBatchCb(const int16_t* d, size_t frames) {
              bool ok = false;
              if (g_audio) {
                  aaudio_result_t r = AAudioStream_write(g_audio, d, (int32_t)frames, 50LL * 1000000LL);
                  ok = r >= 0;
              }
              if (!ok && g_sampleRate > 0) usleep((useconds_t)((long long)frames * 1000000LL / g_sampleRate));
              return frames;
          }
          void audioSampleCb(int16_t l, int16_t r) { int16_t s[2] = {l, r}; audioBatchCb(s, 1); }

          void pollCb() {}
          int16_t stateCb(unsigned port, unsigned device, unsigned index, unsigned id) {
              if (port != 0) return 0;
              if (device == RETRO_DEVICE_JOYPAD) {
                  int b = g_buttons.load();
                  if (id == RETRO_DEVICE_ID_JOYPAD_MASK) return (int16_t)b;
                  if (id > 15) return 0;
                  return (int16_t)((b >> id) & 1);
              }
              if (device == RETRO_DEVICE_ANALOG) {
                  int base = (index == RETRO_DEVICE_INDEX_ANALOG_RIGHT) ? 2 : 0;
                  if (index != RETRO_DEVICE_INDEX_ANALOG_LEFT && index != RETRO_DEVICE_INDEX_ANALOG_RIGHT) return 0;
                  if (id == RETRO_DEVICE_ID_ANALOG_X) return (int16_t)g_axes[base].load();
                  if (id == RETRO_DEVICE_ID_ANALOG_Y) return (int16_t)g_axes[base + 1].load();
              }
              return 0;
          }

          // ---------- EGL ----------
          bool eglInit() {
              g_dpy = eglGetDisplay(EGL_DEFAULT_DISPLAY);
              if (g_dpy == EGL_NO_DISPLAY || !eglInitialize(g_dpy, nullptr, nullptr)) { LOGE("eglInitialize falhou"); return false; }
              const EGLint cfgAttr[] = {EGL_RENDERABLE_TYPE, 0x0040 /*ES3*/, EGL_SURFACE_TYPE, EGL_WINDOW_BIT,
                                        EGL_RED_SIZE, 8, EGL_GREEN_SIZE, 8, EGL_BLUE_SIZE, 8, EGL_ALPHA_SIZE, 8, EGL_NONE};
              EGLConfig cfg; EGLint n = 0;
              if (!eglChooseConfig(g_dpy, cfgAttr, &cfg, 1, &n) || n < 1) { LOGE("eglChooseConfig falhou"); return false; }
              g_surf = eglCreateWindowSurface(g_dpy, cfg, g_window, nullptr);
              if (g_surf == EGL_NO_SURFACE) { LOGE("eglCreateWindowSurface falhou"); return false; }
              const int vers[3][2] = {{3, 2}, {3, 1}, {3, 0}};
              for (int i = 0; i < 3 && g_ctx == EGL_NO_CONTEXT; i++) {
                  const EGLint a[] = {0x3098 /*MAJOR*/, vers[i][0], 0x30FB /*MINOR*/, vers[i][1], EGL_NONE};
                  g_ctx = eglCreateContext(g_dpy, cfg, EGL_NO_CONTEXT, a);
                  if (g_ctx != EGL_NO_CONTEXT) LOGI("contexto OpenGL ES %d.%d criado", vers[i][0], vers[i][1]);
              }
              if (g_ctx == EGL_NO_CONTEXT) {
                  const EGLint a[] = {EGL_CONTEXT_CLIENT_VERSION, 3, EGL_NONE};
                  g_ctx = eglCreateContext(g_dpy, cfg, EGL_NO_CONTEXT, a);
              }
              if (g_ctx == EGL_NO_CONTEXT) { LOGE("eglCreateContext falhou"); return false; }
              return eglMakeCurrent(g_dpy, g_surf, g_surf, g_ctx);
          }
          void eglShutdown() {
              if (g_dpy != EGL_NO_DISPLAY) {
                  eglMakeCurrent(g_dpy, EGL_NO_SURFACE, EGL_NO_SURFACE, EGL_NO_CONTEXT);
                  if (g_ctx != EGL_NO_CONTEXT) eglDestroyContext(g_dpy, g_ctx);
                  if (g_surf != EGL_NO_SURFACE) eglDestroySurface(g_dpy, g_surf);
                  eglTerminate(g_dpy);
              }
              g_dpy = EGL_NO_DISPLAY; g_surf = EGL_NO_SURFACE; g_ctx = EGL_NO_CONTEXT;
          }

          // ---------- jogo ----------
          void runGame(const std::string& romPath, bool& coreLoaded, bool& gameLoaded) {
              g_firstFrame = true;
              g_frameW = g_frameH = 0;
              if (!eglInit()) { setStatus("ERRO: falha ao criar o contexto gráfico (OpenGL ES 3)."); return; }
              eglSwapInterval(g_dpy, 0);
              LOGI("GL_VERSION=%s", (const char*)glGetString(GL_VERSION));
              LOGI("GL_RENDERER=%s", (const char*)glGetString(GL_RENDERER));

              if (!loadCore()) { setStatus("ERRO: não consegui carregar o núcleo N64 (libmupen_core.so). Veja o log."); return; }
              coreLoaded = true;

              p_set_environment(envCb);
              p_set_video_refresh(videoCb);
              p_set_audio_sample(audioSampleCb);
              p_set_audio_batch(audioBatchCb);
              p_set_input_poll(pollCb);
              p_set_input_state(stateCb);
              p_init();

              retro_system_info si{};
              p_get_system_info(&si);
              LOGI("nucleo: %s %s need_fullpath=%d", si.library_name ? si.library_name : "?",
                   si.library_version ? si.library_version : "?", (int)si.need_fullpath);

              retro_game_info gi{};
              std::vector<uint8_t> buf;
              gi.path = romPath.c_str();
              if (!si.need_fullpath) {
                  FILE* f = fopen(romPath.c_str(), "rb");
                  if (!f) { setStatus("ERRO: não consegui ler a ROM."); return; }
                  fseek(f, 0, SEEK_END);
                  long sz = ftell(f);
                  fseek(f, 0, SEEK_SET);
                  buf.resize(sz > 0 ? (size_t)sz : 0);
                  size_t got = fread(buf.data(), 1, buf.size(), f);
                  fclose(f);
                  if (got != buf.size()) { setStatus("ERRO: leitura incompleta da ROM."); return; }
                  gi.data = buf.data();
                  gi.size = buf.size();
              }
              LOGI("carregando ROM (%zu bytes)", buf.size());
              if (!p_load_game(&gi)) { setStatus("ERRO: o núcleo recusou a ROM (formato inválido ou não suportado)."); return; }
              gameLoaded = true;

              retro_system_av_info av{};
              p_get_av_info(&av);
              updateAspect(av.geometry);
              if (av.timing.sample_rate > 0) g_sampleRate = (int)av.timing.sample_rate;
              LOGI("av: base %ux%u max %ux%u aspect=%.3f fps=%.2f rate=%.0f", av.geometry.base_width, av.geometry.base_height,
                   av.geometry.max_width, av.geometry.max_height, g_aspect, av.timing.fps, av.timing.sample_rate);
              unsigned mw = av.geometry.max_width > 640 ? av.geometry.max_width : 640;
              unsigned mh = av.geometry.max_height > 480 ? av.geometry.max_height : 480;
              createFbo(mw, mh);
              audioOpen(g_sampleRate);
              if (g_hw.context_reset) g_hw.context_reset();
              else LOGE("o nucleo nao pediu HW render");
              setStatus("OK");
              LOGI("rodando");

              while (g_running) {
                  if (g_paused) {
                      std::unique_lock<std::mutex> l(g_pauseMutex);
                      g_pauseCv.wait(l, [] { return !g_paused || !g_running; });
                      continue;
                  }
                  p_run();
              }
          }

          void emuThread(std::string romPath) {
              bool coreLoaded = false, gameLoaded = false;
              runGame(romPath, coreLoaded, gameLoaded);
              if (gameLoaded) {
                  if (g_hw.context_destroy) g_hw.context_destroy();
                  p_unload_game();
              }
              if (coreLoaded) { p_deinit(); dlclose(g_lib); g_lib = nullptr; }
              if (g_fbo) destroyFbo();
              audioClose();
              eglShutdown();
              g_hw = retro_hw_render_callback{};
              g_running = false;
              LOGI("thread encerrada");
          }

          std::string jstr(JNIEnv* env, jstring s) {
              const char* c = env->GetStringUTFChars(s, nullptr);
              std::string r = c ? c : "";
              if (c) env->ReleaseStringUTFChars(s, c);
              return r;
          }

          }  // namespace

          extern "C" {

          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_init(JNIEnv* env, jobject, jstring libPath, jstring sysDir, jstring saveDir, jstring logPath) {
              g_libPath = jstr(env, libPath);
              g_systemDir = jstr(env, sysDir);
              g_saveDir = jstr(env, saveDir);
              std::string lp = jstr(env, logPath);
              std::lock_guard<std::mutex> l(g_logMutex);
              if (g_logf) { fclose(g_logf); g_logf = nullptr; }
              if (!lp.empty()) g_logf = fopen(lp.c_str(), "w");
          }
          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_setOption(JNIEnv* env, jobject, jstring k, jstring v) {
              std::lock_guard<std::mutex> l(g_optMutex);
              g_options[jstr(env, k)] = jstr(env, v);
              g_optionsDirty = true;
          }
          JNIEXPORT jstring JNICALL Java_dev_n64emu_app_NativeBridge_getStatus(JNIEnv* env, jobject) {
              std::lock_guard<std::mutex> l(g_statusMutex);
              return env->NewStringUTF(g_status.c_str());
          }
          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_start(JNIEnv* env, jobject, jstring rom, jobject surface) {
              if (g_thread.joinable()) {
                  g_running = false; g_paused = false; g_pauseCv.notify_all();
                  g_thread.join();
                  if (g_window) { ANativeWindow_release(g_window); g_window = nullptr; }
              }
              setStatus("");
              g_buttons = 0;
              for (int i = 0; i < 4; i++) g_axes[i] = 0;
              g_window = ANativeWindow_fromSurface(env, surface);
              g_running = true;
              g_paused = false;
              g_thread = std::thread(emuThread, jstr(env, rom));
          }
          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_pause(JNIEnv*, jobject) { g_paused = true; }
          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_resume(JNIEnv*, jobject) {
              g_paused = false; g_pauseCv.notify_all();
          }
          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_stop(JNIEnv*, jobject) {
              g_running = false; g_paused = false; g_pauseCv.notify_all();
              if (g_thread.joinable()) g_thread.join();
              if (g_window) { ANativeWindow_release(g_window); g_window = nullptr; }
          }
          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_setButton(JNIEnv*, jobject, jint id, jboolean pressed) {
              if (id < 0 || id > 15) return;
              int cur = g_buttons.load();
              g_buttons = pressed ? (cur | (1 << id)) : (cur & ~(1 << id));
          }
          JNIEXPORT void JNICALL Java_dev_n64emu_app_NativeBridge_setAnalog(JNIEnv*, jobject, jint which, jfloat x, jfloat y) {
              int base = which == 1 ? 2 : 0;
              if (x > 1.f) x = 1.f; if (x < -1.f) x = -1.f;
              if (y > 1.f) y = 1.f; if (y < -1.f) y = -1.f;
              g_axes[base] = (int)(x * 32767.f);
              g_axes[base + 1] = (int)(y * 32767.f);
          }

          }
