      - name: Baixar núcleo N64 (GLideN64) e libretro.h
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp/include
          curl -fL -o core.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mupen64plus_next_gles3_libretro_android.so.zip
          unzip -o core.zip -d core_tmp
          cp core_tmp/*.so app/src/main/jniLibs/arm64-v8a/libmupen_core.so
          curl -fL -o app/src/main/cpp/include/libretro.h https://raw.githubusercontent.com/libretro/libretro-common/master/include/libretro.h
          CORE=app/src/main/jniLibs/arm64-v8a/libmupen_core.so
          echo "== dependencias do nucleo =="
          readelf -d "$CORE" | grep NEEDED || true
          if readelf -d "$CORE" | grep -q 'libc++_shared.so'; then
            echo "nucleo precisa de libc++_shared.so: copiando do NDK"
            STL=$(find "$ANDROID_HOME/ndk" -path '*aarch64-linux-android/libc++_shared.so' | head -n 1)
            cp "$STL" app/src/main/jniLibs/arm64-v8a/
          fi
          ls -la app/src/main/jniLibs/arm64-v8a
      - name: Build APK debug
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 64exem-debug
          path: app/build/outputs/apk/debug/*.apk
