          class ModsTab(private val act: MainActivity) {
              val view = ScrollView(act)
              private val col = LinearLayout(act)

              private fun dp(v: Int) = Ui.dp(act, v)

              init {
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(12), dp(12), dp(12), dp(12))
                  view.addView(col)
              }

              fun refresh() {
                  col.removeAllViews()
                  col.addView(Ui.text(act, "Mods", 26f, bold = true))

                  val tex = Ui.card(act)
                  tex.addView(Ui.text(act, "Texturas HD", 18f, bold = true))
                  tex.addView(Ui.text(act, "Importe um pacote .zip e escolha o jogo. Ative em Config > Texturas HD.", 13f, Ui.SUB))
                  tex.addView(Ui.button(act, "Importar pacote (.zip)") { act.pickZip.launch(arrayOf("*/*")) })
                  val packs = Storage.hiresDir(act).listFiles()?.filter { it.isDirectory }?.sortedBy { it.name } ?: emptyList()
                  if (packs.isEmpty()) {
                      val t = Ui.text(act, "Nenhum pacote instalado.", 14f, Ui.SUB)
                      t.setPadding(0, dp(10), 0, 0)
                      tex.addView(t)
                  }
                  for (p in packs) {
                      val row = LinearLayout(act)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.setPadding(0, dp(10), 0, 0)
                      val n = p.walkTopDown().count { it.isFile }
                      val label = Ui.text(act, "${p.name}  ($n arquivos)", 14f)
                      row.addView(label, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                      row.addView(Ui.button(act, "Apagar") {
                          AlertDialog.Builder(act)
                              .setTitle("Apagar ${p.name}?")
                              .setPositiveButton("Apagar") { _, _ -> p.deleteRecursively(); refresh() }
                              .setNegativeButton("Cancelar", null)
                              .show()
                      })
                      tex.addView(row)
                  }
                  col.addView(tex)

                  val hacks = Ui.card(act)
                  hacks.addView(Ui.text(act, "ROM hacks", 18f, bold = true))
                  hacks.addView(Ui.text(act, "ROMs modificadas entram na lista de Jogos como qualquer outra ROM.", 13f, Ui.SUB))
                  hacks.addView(Ui.button(act, "Adicionar ROM modificada") { act.addRoms.launch(arrayOf("*/*")) })
                  col.addView(hacks)

                  val manual = Ui.card(act)
                  manual.addView(Ui.text(act, "Pasta manual de texturas", 18f, bold = true))
                  val path = Ui.text(act, Storage.hiresDir(act).absolutePath + "/NOME INTERNO DO JOGO/", 12f, Ui.SUB)
                  path.setTextIsSelectable(true)
                  manual.addView(path)
                  col.addView(manual)
              }

              fun onZipPicked(uri: Uri) {
                  val list = act.library.games
                  if (list.isEmpty()) {
                      Toast.makeText(act, "Adicione um jogo primeiro na aba Jogos.", Toast.LENGTH_LONG).show()
                      return
                  }
                  val names = list.map { it.title }.toTypedArray()
                  AlertDialog.Builder(act)
                      .setTitle("Pacote para qual jogo?")
                      .setItems(names) { _, i ->
                          val g = list[i]
                          val raw = if (g.romName.isNotBlank()) g.romName else g.title.uppercase()
                          val folder = raw.replace(Regex("[/\\\\:*?\"<>|]"), "_")
                          Toast.makeText(act, "Importando...", Toast.LENGTH_SHORT).show()
                          Thread {
                              val n = try { extract(uri, File(Storage.hiresDir(act), folder)) } catch (e: Exception) { -1 }
                              act.runOnUiThread {
                                  val msg = if (n >= 0) "Importado: $n arquivos" else "Falha ao importar"
                                  Toast.makeText(act, msg, Toast.LENGTH_LONG).show()
                                  refresh()
                              }
                          }.start()
                      }
                      .show()
              }

              private fun extract(uri: Uri, dest: File): Int {
                  val tops = HashSet<String>()
                  var allNested = true
                  val in1 = act.contentResolver.openInputStream(uri) ?: return -1
                  ZipInputStream(in1).use { z ->
                      var e = z.nextEntry
                      while (e != null) {
                          val n = e.name.replace('\\', '/')
                          if (!n.startsWith("__MACOSX")) {
                              val i = n.indexOf('/')
                              if (i < 0) allNested = false else tops.add(n.substring(0, i))
                          }
                          e = z.nextEntry
                      }
                  }
                  val strip = allNested && tops.size == 1
                  dest.mkdirs()
                  val base = dest.canonicalPath
                  var count = 0
                  val in2 = act.contentResolver.openInputStream(uri) ?: return -1
                  ZipInputStream(in2).use { z ->
                      var e = z.nextEntry
                      while (e != null) {
                          val orig = e.name.replace('\\', '/')
                          if (!e.isDirectory && !orig.startsWith("__MACOSX")) {
                              val n = if (strip) orig.substringAfter('/') else orig
                              if (n.isNotEmpty()) {
                                  val out = File(dest, n)
                                  if (out.canonicalPath.startsWith(base)) {
                                      out.parentFile?.mkdirs()
                                      out.outputStream().use { o -> z.copyTo(o) }
                                      count++
                                  }
                              }
                          }
                          e = z.nextEntry
                      }
                  }
                  return count
              }
          }
