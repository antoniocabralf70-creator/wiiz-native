          package dev.n64emu.app

          import android.graphics.Color
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.View
          import android.view.ViewOutlineProvider
          import android.widget.FrameLayout
          import android.widget.GridLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog

          class GamesTab(private val act: MainActivity) {
              val view = FrameLayout(act)
              private val grid = GridLayout(act)
              private val empty: TextView

              private fun dp(v: Int) = Ui.dp(act, v)

              init {
                  val col = LinearLayout(act)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(12), dp(12), dp(12), dp(96))
                  col.addView(Ui.text(act, "Jogos", 26f, bold = true))
                  empty = Ui.text(act, "Nenhum jogo ainda.\nToque em \"＋ Adicionar ROM\" para começar.", 15f, Ui.SUB)
                  empty.setPadding(0, dp(24), 0, dp(24))
                  col.addView(empty)
                  col.addView(grid)
                  val scroll = ScrollView(act)
                  scroll.addView(col)
                  view.addView(scroll, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  val fab = Ui.button(act, "＋ Adicionar ROM") { act.addRoms.launch(arrayOf("*/*")) }
                  val lp = FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM or Gravity.END)
                  lp.setMargins(dp(16), dp(16), dp(16), dp(16))
                  view.addView(fab, lp)
              }

              fun refresh() {
                  grid.removeAllViews()
                  val games = act.library.games
                  empty.visibility = if (games.isEmpty()) View.VISIBLE else View.GONE
                  val screenW = act.resources.displayMetrics.widthPixels
                  val cols = maxOf(2, screenW / dp(160))
                  grid.columnCount = cols
                  val w = (screenW - 2 * dp(12)) / cols - 2 * dp(6)
                  for (g in games) {
                      val lp = GridLayout.LayoutParams()
                      lp.width = w
                      lp.height = GridLayout.LayoutParams.WRAP_CONTENT
                      lp.setMargins(dp(6), dp(6), dp(6), dp(6))
                      grid.addView(card(g, w), lp)
                  }
              }

              private fun card(g: Game, w: Int): View {
                  val box = LinearLayout(act)
                  box.orientation = LinearLayout.VERTICAL
                  box.background = Ui.rounded(Ui.CARD, dp(12))
                  box.clipToOutline = true
                  box.outlineProvider = ViewOutlineProvider.BACKGROUND

                  val frame = FrameLayout(act)
                  val img = ImageView(act)
                  img.scaleType = ImageView.ScaleType.CENTER_CROP
                  val bmp = g.cover?.let { Covers.load(it, w) }
                  if (bmp != null) {
                      img.setImageBitmap(bmp)
                      frame.addView(img, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))
                  } else {
                      val hue = Math.floorMod(g.title.hashCode(), 360).toFloat()
                      frame.setBackgroundColor(Color.HSVToColor(floatArrayOf(hue, 0.5f, 0.45f)))
                      val letter = Ui.text(act, g.title.take(1).uppercase(), 40f, Ui.TEXT, true)
                      letter.gravity = Gravity.CENTER
                      frame.addView(letter, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))
                  }
                  box.addView(frame, LinearLayout.LayoutParams(w, (w * 0.8f).toInt()))

                  val name = Ui.text(act, g.title, 13f)
                  name.maxLines = 2
                  name.ellipsize = TextUtils.TruncateAt.END
                  name.setPadding(dp(8), dp(8), dp(8), dp(8))
                  box.addView(name)

                  box.setOnClickListener { act.launchGame(g) }
                  box.setOnLongClickListener { options(g); true }
                  return box
              }

              private fun options(g: Game) {
                  val items = arrayOf("Escolher capa da galeria", "Buscar capa online", "Remover da lista")
                  AlertDialog.Builder(act)
                      .setTitle(g.title)
                      .setItems(items) { _, which ->
