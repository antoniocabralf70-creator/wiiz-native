                  settings = Settings(this)
                  library = Library(this)
                  games = GamesTab(this)
                  mods = ModsTab(this)
                  config = SettingsTab(this)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Ui.BG)

                  holder = FrameLayout(this)
                  root.addView(holder, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))

                  val nav = LinearLayout(this)
                  nav.orientation = LinearLayout.HORIZONTAL
                  nav.setBackgroundColor(Ui.CARD)
                  val labels = listOf("🎮\nJogos", "🧩\nMods", "⚙️\nConfig")
                  val items = ArrayList<TextView>()
                  for ((i, l) in labels.withIndex()) {
                      val t = TextView(this)
                      t.text = l
                      t.gravity = Gravity.CENTER
                      t.textSize = 12f
                      t.setPadding(0, dp(8), 0, dp(8))
                      t.setOnClickListener { select(i) }
                      nav.addView(t, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                      items.add(t)
                  }
                  navItems = items
                  root.addView(nav)
                  setContentView(root)
                  select(0)

                  val prefs = getSharedPreferences("n64emu", MODE_PRIVATE)
                  if (prefs.getBoolean("game_running", false)) {
                      prefs.edit().putBoolean("game_running", false).apply()
                      Toast.makeText(this, "O jogo anterior fechou de forma inesperada. Veja Config > Diagnóstico.", Toast.LENGTH_LONG).show()
                  }
              }

              private fun select(i: Int) {
                  holder.removeAllViews()
                  val v: View = when (i) {
                      0 -> { games.refresh(); games.view }
                      1 -> { mods.refresh(); mods.view }
                      else -> config.view
                  }
                  holder.addView(v, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))
                  for ((idx, t) in navItems.withIndex()) {
                      t.setTextColor(if (idx == i) Ui.ACCENT else Ui.SUB)
                  }
              }

              fun launchGame(g: Game) {
                  val it = Intent(this, EmulatorActivity::class.java)
                  it.data = Uri.parse(g.uri)
                  it.putExtra("title", g.title)
                  startActivity(it)
              }

              private fun onRomsPicked(uris: List<Uri>) {
                  var added = 0
                  for (uri in uris) {
                      try {
                          contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      } catch (e: Exception) {
                      }
                      if (library.games.any { it.uri == uri.toString() }) continue
                      val g = Game(UUID.randomUUID().toString(), uri.toString(), Rom.displayName(this, uri), Rom.internalName(this, uri), null)
                      library.add(g)
                      added++
                      Thread {
                          val p = Covers.fetchOnline(this, g)
                          if (p != null) {
                              g.cover = p
                              library.save()
                              runOnUiThread { games.refresh() }
                          }
                      }.start()
                  }
                  games.refresh()
                  if (added == 0 && uris.isNotEmpty()) {
                      Toast.makeText(this, "Esse jogo já está na lista.", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun onCoverPicked(uri: Uri?) {
                  val id = coverTarget
                  if (uri == null || id == null) return
                  Thread {
                      val p = Covers.saveFromUri(this, uri, id)
                      runOnUiThread {
                          if (p != null) {
                              library.find(id)?.cover = p
                              library.save()
                              games.refresh()
                          } else {
                              Toast.makeText(this, "Não consegui usar essa imagem.", Toast.LENGTH_LONG).show()
                          }
                      }
                  }.start()
              }
          }
