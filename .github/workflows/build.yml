          package dev.n64emu.app

          import android.content.Context
          import android.net.Uri
          import android.provider.OpenableColumns

          object Rom {
              fun displayName(ctx: Context, uri: Uri): String {
                  var name: String? = null
                  try {
                      val c = ctx.contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)
                      if (c != null) {
                          if (c.moveToFirst()) name = c.getString(0)
                          c.close()
                      }
                  } catch (e: Exception) {
                  }
                  val n = name ?: uri.lastPathSegment ?: "ROM"
                  return n.substringBeforeLast('.')
              }

              /** Nome interno do cabeçalho da ROM (usado como nome da pasta de texturas HD). */
              fun internalName(ctx: Context, uri: Uri): String {
                  try {
                      val buf = ByteArray(0x40)
                      val ins = ctx.contentResolver.openInputStream(uri) ?: return ""
                      var off = 0
                      ins.use {
                          while (off < buf.size) {
                              val r = it.read(buf, off, buf.size - off)
                              if (r < 0) break
                              off += r
                          }
                      }
                      val sw = ByteArray(0x40)
                      when (buf[0].toInt() and 0xFF) {
                          0x80 -> System.arraycopy(buf, 0, sw, 0, 0x40)
                          0x37 -> {
                              var i = 0
                              while (i < 0x40) { sw[i] = buf[i + 1]; sw[i + 1] = buf[i]; i += 2 }
                          }
                          0x40 -> {
                              var i = 0
                              while (i < 0x40) { sw[i] = buf[i + 3]; sw[i + 1] = buf[i + 2]; sw[i + 2] = buf[i + 1]; sw[i + 3] = buf[i]; i += 4 }
                          }
                          else -> return ""
                      }
                      return String(sw, 0x20, 20, Charsets.US_ASCII).trim { it <= ' ' || it == '\u0000' }
                  } catch (e: Exception) {
                      return ""
                  }
              }
          }
